<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athlete Performance Tracking</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, system-ui, Roboto, Arial, sans-serif; background: #f4f5f7; color: #1c1e21; padding-bottom: 96px; }
  header { background: #1f2937; color: #fff; padding: 12px 16px; font-size: 18px; font-weight: 600; }
  .card { background: #fff; margin: 10px; padding: 12px; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: block; font-size: 12px; color: #555; margin-bottom: 2px; }
  select, input { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #c5c9d0; border-radius: 8px; background: #fff; }
  #results { margin-top: 6px; }
  #unlock { margin-top: 10px; width: 100%; font-size: 17px; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; }
  .lockMsg { margin-top: 8px; font-size: 14px; color: #991b1b; }
  body.locked #app, body.locked footer { display: none; }
  .whenBox { display: none; }
  .earlier .whenBox { display: block; }
  .hit { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 16px; }
  .hit:active { background: #eef2ff; }
  .row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .row .name { flex: 1 1 auto; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row input { flex: 0 0 78px; width: 78px; padding: 10px 6px; text-align: center; }
  .row input.bad { border-color: #d97706; background: #fff7ed; }
  .row input.err { border-color: #dc2626; background: #fef2f2; }
  .compact input, .compact span { flex-basis: 62px !important; width: 62px !important; }
  .row button { flex: 0 0 36px; height: 40px; border: 0; background: none; font-size: 20px; color: #888; }
  .heads { display: flex; gap: 6px; font-size: 11px; color: #666; padding-right: 42px; }
  .heads span { flex: 0 0 78px; text-align: center; }
  .heads .sp { flex: 1 1 auto; }
  .empty { color: #777; font-size: 14px; padding: 8px 0; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 10px; }
  #submit { width: 100%; font-size: 18px; font-weight: 600; padding: 14px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; }
  #submit:disabled { background: #9ca3af; }
  #status { font-size: 14px; margin-bottom: 8px; display: none; padding: 8px 10px; border-radius: 8px; }
  #status.ok { display: block; background: #dcfce7; color: #166534; }
  #status.warn { display: block; background: #fef3c7; color: #92400e; }
  #status.fail { display: block; background: #fee2e2; color: #991b1b; }
  #ask { display: none; margin-bottom: 8px; padding: 10px; border-radius: 8px; background: #fef3c7; color: #92400e; font-size: 14px; }
  #ask .btns { display: flex; gap: 8px; margin-top: 8px; }
  #ask button { flex: 1; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #92400e; background: #fff; color: #92400e; }
  #ask button.yes { background: #92400e; color: #fff; }
</style>
</head>
<body>
<header>Athlete Performance Tracking</header>

<div class="card" id="lock" style="display:none">
  <label for="code">Access code</label>
  <input id="code" type="password" autocomplete="current-password" placeholder="Enter the code your coach lead gave you">
  <button id="unlock" type="button">Continue</button>
  <div id="lockMsg" class="lockMsg"></div>
</div>

<div id="app">

<div class="card">
  <div class="grid">
    <div><label for="coach">Coach</label><select id="coach"></select></div>
    <div><label for="group">Time</label><select id="group"></select></div>
    <div><label for="test">Category</label><select id="test"></select></div>
    <div id="detailWrap"><label for="detail" id="detailLabel">Test</label><select id="detail"></select></div>
    <div><label for="when">When was the session?</label><select id="when"><option value="now">Right now</option><option value="earlier">Earlier (pick date and time)</option></select></div>
    <div></div>
    <div class="whenBox"><label for="wdate">Session date</label><input id="wdate" type="date"></div>
    <div class="whenBox"><label for="wtime">Session time</label><input id="wtime" type="time"></div>
  </div>
</div>

<div class="card">
  <label for="search">Add an athlete from any group</label>
  <input id="search" type="search" placeholder="Type a few letters of a name" autocomplete="off">
  <div id="results"></div>
</div>

<div class="card">
  <div class="heads" id="heads"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</div>

</div>

<footer>
  <div id="status"></div>
  <div id="ask"><div id="askMsg"></div><div class="btns"><button id="askNo">Cancel</button><button id="askYes" class="yes">Save anyway</button></div></div>
  <button id="submit" disabled>Submit</button>
</footer>

<script>
  // The web app link from Apps Script (Deploy > Manage deployments). Must end in /exec.
  var API_URL = 'https://script.google.com/macros/s/AKfycbzTyXDJZaKhGlcyrsqeSMhtTEAwvYBnDBwWQbudtjrpVRkum5cvw0nvoiu7ApRlsbCB/exec';

  // The tests come from the Tests tab of the sheet: Category, Test, Input.
  // Input decides which boxes appear. These are the box types the page knows how to draw.
  var INPUT_FIELDS = {
    'Fly 10 yd time':  [ { k: 'result', label: 'Time s', min: 0.7, max: 2.5 } ],
    'Time':            [ { k: 'result', label: 'Time s', min: 0.5, max: 15 } ],
    'Splits 10/20':    [ { k: 's10', label: '10 yd', min: 1, max: 4, skip: true },
                         { k: 'result', label: '20 yd', min: 2, max: 6 } ],
    'Splits 10/20/30': [ { k: 's10', label: '10 yd', min: 1, max: 4, skip: true },
                         { k: 's20', label: '20 yd', min: 2, max: 6, skip: true },
                         { k: 'result', label: '30 yd', min: 3, max: 8 } ],
    'Inches':          [ { k: 'result', label: 'Inches', min: 5, max: 60 } ],
    'Feet & inches':   [ { k: 'ft', label: 'Feet', min: 2, max: 45, whole: true },
                         { k: 'inch', label: 'Inches', min: 0, max: 11.9, optional: true } ],
    'Number':          [ { k: 'result', label: '', min: 0, max: Infinity } ],
    'Weight & reps':   [ { k: 'weight', label: 'Weight lb', min: 20, max: 1000 },
                         { k: 'reps', label: 'Reps', min: 1, max: 20, whole: true } ],
    'Pounds':          [ { k: 'result', label: 'Peak lb', min: 100, max: 1500 } ],
    'Peak, time to peak, impulse': [ { k: 'result', label: 'Peak lb', min: 100, max: 1500 },
                         { k: 'ttp', label: 'To peak s', min: 0.05, max: 5, skip: true },
                         { k: 'impulse', label: 'Impulse', min: 0, max: Infinity, skip: true } ]
  };

  function categories() {
    var seen = {}, out = [];
    app.tests.forEach(function (t) { if (!seen[t.category]) { seen[t.category] = true; out.push(t.category); } });
    return out;
  }

  function curTest() {
    var cat = $('test').value;
    if (!cat) return null;
    var list = app.tests.filter(function (t) { return t.category === cat; });
    var row = list.filter(function (t) { return t.test === $('detail').value; })[0];
    var fields = [];
    if (row && INPUT_FIELDS[row.input]) {
      fields = INPUT_FIELDS[row.input].map(function (f) {
        var copy = {}; for (var k in f) copy[k] = f[k];
        if (!copy.label) copy.label = row.test;           // a "Number" box is labelled with the test name
        return copy;
      });
    }
    return { detailLabel: 'Test', details: list.map(function (t) { return t.test; }), fields: fields,
             unknown: !!row && !INPUT_FIELDS[row.input] };
  }

  var app = null;      // lists and roster from the sheet
  var today = [];      // [{id, name, vals: {}}] athletes on screen
  var busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function remember(key, value) { try { localStorage.setItem('te_' + key, value); } catch (e) {} }
  function recall(key) { try { return localStorage.getItem('te_' + key); } catch (e) { return null; } }

  function fill(select, items, saved, labelOf) {
    select.innerHTML = '';
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = 'Select…';
    select.appendChild(blank);
    items.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v; o.textContent = labelOf ? labelOf(v) : v;
      select.appendChild(o);
    });
    select.value = (saved && items.indexOf(saved) !== -1) ? saved : '';
  }

  function status(kind, msg) {
    var s = $('status');
    s.className = kind || '';
    s.textContent = msg || '';
  }

  function ask(msg, yesText, onYes) {
    $('askMsg').textContent = msg;
    $('askYes').textContent = yesText;
    $('ask').style.display = 'block';
    $('submit').style.display = 'none';
    $('askYes').onclick = function () { closeAsk(); onYes(); };
    $('askNo').onclick = function () { closeAsk(); };
  }
  function closeAsk() { $('ask').style.display = 'none'; $('submit').style.display = 'block'; }

  // A group named "Shad - 6:30a M/W" belongs to coach Shad. Groups with no coach
  // name in front are shared and show for everyone.
  function ownerOf(group) {
    var g = group.toLowerCase(), found = '';
    app.coaches.forEach(function (c) {
      if (g.indexOf(c.toLowerCase() + ' - ') === 0 && c.length > found.length) found = c;
    });
    return found;
  }

  function fillGroups(keep) {
    var coach = $('coach').value;
    $('group').disabled = !coach;
    if (!coach) { fill($('group'), [], ''); return; }
    var mine = app.groups.filter(function (g) { var o = ownerOf(g); return o === '' || o === coach; });
    if (!mine.length) mine = app.groups;
    // "All my athletes" sits at the top whenever the coach has slots of their own.
    if (mine.some(function (g) { return ownerOf(g) === coach; })) mine = [allFor(coach)].concat(mine);
    fill($('group'), mine, keep, function (g) {
      return ownerOf(g) === coach ? g.slice(coach.length + 3) : g;
    });
  }

  function init(data) {
    app = data;
    // Everything starts blank; a refresh of the roster keeps whatever is already picked.
    var cur = { coach: $('coach').value, group: $('group').value, test: $('test').value, detail: $('detail').value };
    fill($('coach'), app.coaches, cur.coach);
    fillGroups(cur.group);
    if (!app.tests) {
      app.tests = [];
      status('fail', 'The sheet is missing its Tests tab. Update the Apps Script and run setup.');
    }
    fill($('test'), categories(), cur.test);
    onTestChange(true, cur.detail);
    loadGroup();
    $('submit').disabled = false;
  }

  var ALL = 'All my athletes';
  function allFor(coach) { return coach + ' - ' + ALL; }

  function loadGroup() {
    var g = $('group').value;
    var coach = $('coach').value;
    var everyone = g !== '' && g === allFor(coach);
    var kept = {};
    today.forEach(function (a) { kept[a.id] = a.vals; });
    today = app.roster
      .filter(function (a) { return everyone ? (a.group !== '' && ownerOf(a.group) === coach) : (g !== '' && a.group === g); })
      .map(function (a) { return { id: a.id, name: a.name, vals: kept[a.id] || {} }; });
    render();
  }

  function onTestChange(first, keepDetail) {
    var t = curTest();
    if (t) {
      $('detailWrap').style.visibility = 'visible';
      $('detailLabel').textContent = t.detailLabel;
      fill($('detail'), t.details, keepDetail);
    } else {
      $('detailWrap').style.visibility = 'hidden';
      fill($('detail'), [], '');
    }
    if (!first) today.forEach(function (a) { a.vals = {}; });
    render();
  }

  function render() {
    var t = curTest() || { fields: [] };
    if (t.unknown) status('fail', 'This test\'s Input in the Tests tab isn\'t one the page knows. Check the spelling there.');
    var compact = t.fields.length >= 3;
    $('heads').classList.toggle('compact', compact);
    $('list').classList.toggle('compact', compact);
    var heads = $('heads');
    heads.innerHTML = '<span class="sp"></span>';
    t.fields.forEach(function (f) {
      var s = document.createElement('span'); s.textContent = f.label; heads.appendChild(s);
    });

    var list = $('list');
    list.innerHTML = '';
    if (!today.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = $('group').value ? 'No regulars in this group yet. Search a name above to add one.' : 'Pick a coach and a time to load athletes.';
      list.appendChild(e);
      return;
    }
    today.forEach(function (a, i) {
      var row = document.createElement('div'); row.className = 'row';
      var n = document.createElement('div'); n.className = 'name'; n.textContent = a.name;
      row.appendChild(n);
      t.fields.forEach(function (f) {
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.inputMode = f.whole ? 'numeric' : 'decimal';
        inp.value = a.vals[f.k] === undefined ? '' : a.vals[f.k];
        inp.setAttribute('aria-label', a.name + ' ' + f.label);
        inp.dataset.i = i; inp.dataset.k = f.k;
        inp.addEventListener('input', function () {
          a.vals[f.k] = inp.value.trim();
          inp.classList.remove('bad'); inp.classList.remove('err');
        });
        row.appendChild(inp);
      });
      var x = document.createElement('button');
      x.textContent = '×'; x.setAttribute('aria-label', 'Remove ' + a.name);
      x.addEventListener('click', function () { today.splice(i, 1); render(); });
      row.appendChild(x);
      list.appendChild(row);
    });
  }

  function onSearch() {
    var q = $('search').value.trim().toLowerCase();
    var box = $('results');
    box.innerHTML = '';
    if (q.length < 2) return;
    var have = {};
    today.forEach(function (a) { have[a.id] = true; });
    app.roster
      .filter(function (a) { return !have[a.id] && a.name.toLowerCase().indexOf(q) !== -1; })
      .slice(0, 8)
      .forEach(function (a) {
        var d = document.createElement('div'); d.className = 'hit';
        d.textContent = a.name + (a.group ? '  ·  ' + a.group : '');
        d.addEventListener('click', function () {
          today.push({ id: a.id, name: a.name, vals: {} });
          $('search').value = ''; box.innerHTML = '';
          render();
        });
        box.appendChild(d);
      });
    if (!box.children.length) {
      var none = document.createElement('div'); none.className = 'empty';
      none.textContent = 'No match. New athletes are added in the Roster tab of the sheet.';
      box.appendChild(none);
    }
  }

  function mark(i, k, cls) {
    var el = document.querySelector('input[data-i="' + i + '"][data-k="' + k + '"]');
    if (el) el.classList.add(cls);
  }

  function submit() {
    if (busy) return;
    status('', '');
    var t = curTest();
    var missing = [];
    if (!$('coach').value) missing.push('coach');
    if (!$('group').value) missing.push('time');
    if (!t) missing.push('category');
    else if (!$('detail').value) missing.push(t.detailLabel.toLowerCase());
    var when = null;
    if ($('when').value === 'earlier') {
      if (!$('wdate').value) missing.push('session date');
      if (!$('wtime').value) missing.push('session time');
      when = { date: $('wdate').value, time: $('wtime').value.slice(0, 5) };
    }
    if (missing.length) { status('warn', 'Still needed: ' + missing.join(', ') + '.'); return; }
    if (when && when.date > localDay()) { status('warn', 'The session date is in the future. Check the date.'); return; }
    var entries = [], errors = 0, odd = 0;

    today.forEach(function (a, i) {
      var filled = t.fields.filter(function (f) { return a.vals[f.k] !== undefined && a.vals[f.k] !== ''; });
      if (!filled.length) return;                       // blank row = absent, skip it
      var entry = { id: a.id, name: a.name };
      t.fields.forEach(function (f) {
        var raw = a.vals[f.k];
        if (f.skip && (raw === undefined || raw === '')) return;   // split left blank: fine, just not saved
        if (f.optional && (raw === undefined || raw === '')) raw = '0';
        var v = Number(raw);
        if (raw === undefined || raw === '' || isNaN(v) || v < 0 || (v === 0 && !f.optional) || (f.whole && v % 1 !== 0)) {
          errors++; mark(i, f.k, 'err'); return;
        }
        if (v < f.min || v > f.max) { odd++; mark(i, f.k, 'bad'); }
        entry[f.k] = v;
      });
      // Cumulative split times have to go up: 10 yd < 20 yd < finish.
      var seq = ['s10', 's20', 'result'].filter(function (k) { return entry[k] !== undefined; });
      for (var s = 1; s < seq.length; s++) {
        if (entry[seq[s]] <= entry[seq[s - 1]]) { odd++; mark(i, seq[s], 'bad'); }
      }
      if (entry.ft !== undefined) {                     // feet + inches are saved as total inches
        entry.result = Math.round((entry.ft * 12 + (entry.inch || 0)) * 10) / 10;
        delete entry.ft; delete entry.inch;
      }
      entries.push(entry);
    });

    if (errors) { status('fail', 'Fix the red boxes: each athlete needs a number in every box (inches, dash splits, time to peak and impulse can be left blank).'); return; }
    if (!entries.length) { status('warn', 'Nothing entered yet.'); return; }

    var payload = {
      coach: $('coach').value, group: $('group').value, test: $('test').value,
      detail: $('detail').value, when: when, entries: entries
    };
    if (odd) {
      ask(odd + (odd === 1 ? ' value looks' : ' values look') + ' unusual (highlighted). Check for typos.', 'Save anyway',
        function () { send(payload, false); });
    } else {
      send(payload, false);
    }
  }

  // Talks to the sheet. No body = load the lists; with a body = save results.
  // Every request goes as a POST carrying the shared access code.
  var accessCode = recall('code') || '';
  function callApi(body) {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 30000);
    body = body || { action: 'load' };
    body.code = accessCode;
    var opts = { redirect: 'follow', signal: ctl.signal, method: 'POST', body: JSON.stringify(body) };
    return fetch(API_URL, opts).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }, function (e) {
      clearTimeout(timer);
      throw new Error(e && e.name === 'AbortError' ? 'timed out' : 'no connection');
    }).then(function (d) {
      if (d && d.error === 'ACCESS') { lockOut(d.message); throw new Error(d.message); }
      if (d && d.error) throw new Error(d.error);
      return d;
    });
  }

  function send(payload, force) {
    busy = true;
    $('submit').disabled = true;
    $('submit').textContent = 'Saving…';
    var done = function () { busy = false; $('submit').disabled = false; $('submit').textContent = 'Submit'; };

    callApi({ action: 'save', payload: payload, force: !!force }).then(function (res) {
      done();
      if (res && res.duplicates) {
        var names = res.duplicates.map(function (d) { return d.name + ' (by ' + d.coach + ')'; }).join(', ');
        ask('Already entered for this test on that day: ' + names + '.', 'Save again',
          function () { send(payload, true); });
        return;
      }
      today.forEach(function (a) { a.vals = {}; });
      render();
      status('ok', res.saved + ' saved ✓  ' + payload.test + (payload.detail ? ' · ' + payload.detail : '') +
        (payload.when ? ' · session ' + payload.when.date + ' ' + payload.when.time : ''));
    }, function (err) {
      done();
      status('fail', 'NOT saved. Your numbers are still here. Check your connection and tap Submit again. (' +
        (err && err.message ? err.message : 'no response') + ')');
    });
  }

  $('coach').addEventListener('change', function () { status('', ''); fillGroups(); loadGroup(); });
  $('group').addEventListener('change', function () { status('', ''); loadGroup(); });
  $('test').addEventListener('change', function () { status('', ''); onTestChange(false); });
  $('detail').addEventListener('change', function () {
    status('', '');
    today.forEach(function (a) { a.vals = {}; });
    render();
  });
  function localDay() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  $('when').addEventListener('change', function () {
    status('', '');
    document.body.classList.toggle('earlier', this.value === 'earlier');
    $('wdate').max = localDay();
  });
  $('search').addEventListener('input', onSearch);
  $('submit').addEventListener('click', submit);

  // Wrong or changed code: forget it (and the saved roster) and ask again.
  function lockOut(msg) {
    accessCode = '';
    try { localStorage.removeItem('te_code'); localStorage.removeItem('te_appdata'); } catch (e) {}
    document.body.classList.add('locked');
    $('lock').style.display = 'block';
    $('lockMsg').textContent = msg || '';
    $('unlock').disabled = false;
    $('unlock').textContent = 'Continue';
  }

  function unlock() {
    var c = $('code').value.trim();
    if (!c) { $('lockMsg').textContent = 'Enter the access code.'; return; }
    accessCode = c;
    $('unlock').disabled = true;
    $('unlock').textContent = 'Checking…';
    $('lockMsg').textContent = '';
    callApi().then(function (d) {
      remember('code', c);
      remember('appdata', JSON.stringify(d));
      document.body.classList.remove('locked');
      $('lock').style.display = 'none';
      $('code').value = '';
      status('', '');
      init(d);
    }, function (err) {
      if (accessCode) {                                 // not a code problem: connection, etc.
        $('unlock').disabled = false;
        $('unlock').textContent = 'Continue';
        $('lockMsg').textContent = 'Could not check the code (' + err.message + '). Try again.';
      }
    });
  }
  $('unlock').addEventListener('click', unlock);
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') unlock(); });

  if (!accessCode) {
    lockOut('');
  } else {
    // Show the roster saved on this device straight away, then refresh it from the sheet.
    var cached = recall('appdata');
    if (cached) { try { init(JSON.parse(cached)); } catch (e) { cached = null; } }

    callApi().then(function (d) {
      var fresh = JSON.stringify(d);
      if (fresh === cached) return;
      remember('appdata', fresh);
      init(d);
    }, function (err) {
      if (!accessCode) return;                          // the code was refused; the code screen is showing
      if (app) {
        status('warn', 'Showing the roster saved on this device; could not refresh it (' + err.message + ').');
      } else {
        $('list').innerHTML = '';
        status('fail', 'Could not load the roster. Check your connection and reload. (' + err.message + ')');
      }
    });
  }
</script>
</body>
</html>
